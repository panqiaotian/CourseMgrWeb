{% extends 'layout.html' %}

{% block title %}{% if payment %}编辑缴费记录{% else %}添加缴费记录{% endif %} - 课程管理系统{% endblock %}

{% block content %}
<div class="card shadow mb-4">
    <div class="card-header py-3">
        <h6 class="m-0 font-weight-bold text-primary">{% if payment %}编辑缴费记录{% else %}添加缴费记录{% endif %}</h6>
    </div>
    <div class="card-body">
        <form method="post" class="needs-validation" novalidate>
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
            <div class="mb-3">
                <label for="student_id" class="form-label">学生</label>
                <select class="form-select" id="student_id" name="student_id" required>
                    <option value="" disabled {% if not payment %}selected{% endif %}>请选择学生</option>
                    {% for student in students %}
                    <option value="{{ student.id }}" {% if payment and payment.student_id == student.id %}selected{% endif %}>{{ student.name }}</option>
                    {% endfor %}
                </select>
                <div class="invalid-feedback">请选择学生</div>
            </div>
            
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="amount" class="form-label">金额</label>
                    <input type="number" step="0.01" class="form-control" id="amount" name="amount" value="{{ payment.amount if payment else '' }}" required>
                    <div class="invalid-feedback">请输入金额</div>
                </div>
                
                <div class="col-md-6 mb-3">
                    <label for="payment_date" class="form-label">缴费日期</label>
                    <input type="date" class="form-control" id="payment_date" name="payment_date" value="{{ payment.payment_date.strftime('%Y-%m-%d') if payment else '' }}" required>
                    <div class="invalid-feedback">请选择缴费日期</div>
                </div>
            </div>
            
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="payment_method" class="form-label">支付方式</label>
                    <select class="form-select" id="payment_method" name="payment_method" required>
                        <option value="" disabled {% if not payment %}selected{% endif %}>请选择支付方式</option>
                        <option value="现金" {% if payment and payment.payment_method == '现金' %}selected{% endif %}>现金</option>
                        <option value="微信" {% if payment and payment.payment_method == '微信' %}selected{% endif %}>微信</option>
                        <option value="支付宝" {% if payment and payment.payment_method == '支付宝' %}selected{% endif %}>支付宝</option>
                        <option value="银行转账" {% if payment and payment.payment_method == '银行转账' %}selected{% endif %}>银行转账</option>
                    </select>
                    <div class="invalid-feedback">请选择支付方式</div>
                </div>
                
                <div class="col-md-6 mb-3">
                    <label for="discount" class="form-label">折扣</label>
                    <input type="number" step="0.01" class="form-control" id="discount" name="discount" value="{{ payment.discount if payment else '0' }}">
                </div>
            </div>
            
            <div class="d-flex justify-content-between">
                <button type="submit" class="btn btn-primary">保存</button>
                <a href="{{ url_for('payments') }}" class="btn btn-secondary">取消</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    // 表单验证
    (function() {
        'use strict';
        
        var forms = document.querySelectorAll('.needs-validation');
        
        Array.prototype.slice.call(forms).forEach(function(form) {
            form.addEventListener('submit', function(event) {
                if (!form.checkValidity()) {
                    event.preventDefault();
                    event.stopPropagation();
                }
                
                form.classList.add('was-validated');
            }, false);
        });
    })();
</script>
{% endblock %}
