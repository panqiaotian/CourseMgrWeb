<!-- 统一的搜索表单组件 -->
<!-- 使用方法: 在需要的地方引用此组件 -->
<!-- 需要的变量: search, route_name, placeholder, per_page -->

<div class="row mb-3 align-items-center">
    <div class="col-md-8 col-lg-6">
        <form method="get" action="{{ url_for(route_name) }}" class="d-flex">
            <div class="input-group">
                <input type="text" class="form-control" name="search" 
                       value="{{ search or '' }}" placeholder="{{ placeholder or '搜索...' }}">
                <button type="submit" class="btn btn-outline-primary" title="搜索">
                    <i class="fas fa-search"></i>
                </button>
                {% if search %}
                <a href="{{ url_for(route_name, per_page=per_page) }}" class="btn btn-outline-secondary" title="清除搜索">
                    <i class="fas fa-times"></i>
                </a>
                {% endif %}
            </div>
        </form>
    </div>
    <div class="col-md-4 col-lg-6 text-end">
        <div class="d-flex justify-content-end align-items-center">
            <small class="text-muted me-2">每页显示:</small>
            <div class="btn-group btn-group-sm" role="group">
                <a href="{{ url_for(route_name, per_page=10, search=search) }}" 
                   class="btn btn-outline-secondary {{ 'active' if per_page == 10 else '' }}">10</a>
                <a href="{{ url_for(route_name, per_page=25, search=search) }}" 
                   class="btn btn-outline-secondary {{ 'active' if per_page == 25 else '' }}">25</a>
                <a href="{{ url_for(route_name, per_page=50, search=search) }}" 
                   class="btn btn-outline-secondary {{ 'active' if per_page == 50 else '' }}">50</a>
            </div>
        </div>
    </div>
</div>
