{% extends 'layout.html' %}

{% block title %}
    {% if teacher %}编辑教师{% else %}添加教师{% endif %} - 课程管理系统
{% endblock %}

{% block content %}
<div class="card shadow">
    <div class="card-header bg-primary text-white">
        <h5 class="my-0">{% if teacher %}编辑教师{% else %}添加教师{% endif %}</h5>
    </div>
    <div class="card-body">
        <form method="post" class="needs-validation" novalidate>
            <div class="row mb-3">
                <div class="col-md-6">
                    <label for="name" class="form-label">姓名 <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" id="name" name="name" value="{{ teacher.name if teacher else '' }}" required>
                    <div class="invalid-feedback">请输入教师姓名</div>
                </div>
                <div class="col-md-6">
                    <label for="gender" class="form-label">性别</label>
                    <select class="form-select" id="gender" name="gender">
                        <option value="">请选择</option>
                        <option value="男" {% if teacher and teacher.gender == '男' %}selected{% endif %}>男</option>
                        <option value="女" {% if teacher and teacher.gender == '女' %}selected{% endif %}>女</option>
                    </select>
                </div>
            </div>
            
            <div class="row mb-3">
                <div class="col-md-6">
                    <label for="phone" class="form-label">联系电话</label>
                    <input type="tel" class="form-control" id="phone" name="phone" value="{{ teacher.phone if teacher else '' }}">
                </div>
                <div class="col-md-6">
                    <label for="email" class="form-label">电子邮箱</label>
                    <input type="email" class="form-control" id="email" name="email" value="{{ teacher.email if teacher else '' }}">
                </div>
            </div>
            
            <div class="row mb-3">
                <div class="col-md-6">
                    <label for="subject" class="form-label">主教科目</label>
                    <input type="text" class="form-control" id="subject" name="subject" value="{{ teacher.subject if teacher else '' }}">
                </div>
                <div class="col-md-6">
                    <label for="status" class="form-label">状态</label>
                    <select class="form-select" id="status" name="status">
                        <option value="在职" {% if not teacher or teacher.status == '在职' %}selected{% endif %}>在职</option>
                        <option value="离职" {% if teacher and teacher.status == '离职' %}selected{% endif %}>离职</option>
                    </select>
                </div>
            </div>
            
            <div class="row mb-3">
                <div class="col-md-6">
                    <label for="entry_date" class="form-label">入职日期</label>
                    <input type="date" class="form-control" id="entry_date" name="entry_date" 
                           value="{{ teacher.entry_date.strftime('%Y-%m-%d') if teacher and teacher.entry_date else '' }}">
                </div>
            </div>
            
            <div class="mb-3">
                <label for="notes" class="form-label">备注信息</label>
                <textarea class="form-control" id="notes" name="notes" rows="3">{{ teacher.notes if teacher else '' }}</textarea>
            </div>
            
            <div class="d-flex justify-content-between">
                <a href="{{ url_for('teachers') }}" class="btn btn-secondary">返回</a>
                <button type="submit" class="btn btn-primary">保存</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
