<!-- 统一的空状态组件 -->
<!-- 使用方法: 在模板中引用此组件，传递必要的变量 -->
<!-- 需要的变量: search, empty_message, search_message, colspan, add_url, add_text -->

<tr>
    <td colspan="{{ colspan or 5 }}" class="empty-state">
        {% if search %}
            <div class="mb-3">
                <i class="fas fa-search fa-3x text-muted"></i>
            </div>
            <h5 class="text-muted mb-2">{{ search_message or '没有找到匹配的记录' }}</h5>
            <p class="text-muted mb-3">搜索关键词: "{{ search }}"</p>
            <div>
                <a href="{{ url_for(request.endpoint) }}" class="btn btn-outline-secondary btn-sm">
                    <i class="fas fa-times"></i> 清除搜索
                </a>
                {% if add_url %}
                <a href="{{ add_url }}" class="btn btn-primary btn-sm ms-2">
                    <i class="fas fa-plus"></i> {{ add_text or '添加新记录' }}
                </a>
                {% endif %}
            </div>
        {% else %}
            <div class="mb-3">
                <i class="fas fa-inbox fa-3x text-muted"></i>
            </div>
            <h5 class="text-muted mb-2">{{ empty_message or '暂无数据' }}</h5>
            <p class="text-muted mb-3">还没有任何记录，开始添加第一条记录吧！</p>
            {% if add_url %}
            <a href="{{ add_url }}" class="btn btn-primary">
                <i class="fas fa-plus"></i> {{ add_text or '添加新记录' }}
            </a>
            {% endif %}
        {% endif %}
    </td>
</tr>
