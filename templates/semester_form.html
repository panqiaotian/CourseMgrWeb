{% extends 'layout.html' %}

{% block title %}{% if editing %}修改学期标签{% else %}新增学期标签{% endif %} - 课程管理系统{% endblock %}

{% block content %}
<div class="card shadow">
    <div class="card-header py-3">
        <h6 class="m-0 font-weight-bold text-primary">
            {% if editing %}<i class="fas fa-edit"></i> 修改学期标签{% else %}<i class="fas fa-plus"></i> 新增学期标签{% endif %}
        </h6>
    </div>
    <div class="card-body">
        <form method="POST" action="{{ url_for('add_semester') if not editing else url_for('edit_semester', tag_id=tag.id) }}">
            <div class="mb-3">
                <label for="name" class="form-label">标签名称 <span class="text-danger">*</span></label>
                <input type="text" class="form-control" id="name" name="name" 
                       value="{{ tag.name if tag else '' }}" required
                       placeholder="例如：2024 年秋季学期">
            </div>
            
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="start_date" class="form-label">开始日期 <span class="text-danger">*</span></label>
                    <input type="date" class="form-control" id="start_date" name="start_date" 
                           value="{{ tag.start_date if tag else '' }}" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label for="end_date" class="form-label">结束日期 <span class="text-danger">*</span></label>
                    <input type="date" class="form-control" id="end_date" name="end_date" 
                           value="{{ tag.end_date if tag else '' }}" required>
                </div>
            </div>
            
            <div class="mb-3">
                <label for="tag_type" class="form-label">标签类型 <span class="text-danger">*</span></label>
                <select class="form-select" id="tag_type" name="tag_type" required>
                    <option value="">-- 请选择类型 --</option>
                    <option value="上学期" {% if tag and tag.tag_type == '上学期' %}selected{% endif %}>上学期</option>
                    <option value="下学期" {% if tag and tag.tag_type == '下学期' %}selected{% endif %}>下学期</option>
                    <option value="寒假" {% if tag and tag.tag_type == '寒假' %}selected{% endif %}>寒假</option>
                    <option value="暑假" {% if tag and tag.tag_type == '暑假' %}selected{% endif %}>暑假</option>
                </select>
                <div class="form-text">上学期：通常为 9 月至 1 月；下学期：通常为 2 月至 7 月</div>
            </div>
            
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-save"></i> 
                    {% if editing %}保存修改{% else %}保存{% endif %}
                </button>
                <a href="{{ url_for('semesters') }}" class="btn btn-secondary">
                    <i class="fas fa-times"></i> 取消
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
