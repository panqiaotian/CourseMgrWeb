<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>排序功能测试</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .test-container {
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }
        .test-result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 5px;
        }
        .success {
            background-color: #d4edda;
            border: 1px solid #c3e6cb;
            color: #155724;
        }
        .error {
            background-color: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
        }
    </style>
</head>
<body>
    <div class="test-container">
        <h1 class="text-center mb-4">课程记录排序功能测试</h1>
        
        <div class="card">
            <div class="card-header">
                <h5 class="mb-0">测试排序链接生成</h5>
            </div>
            <div class="card-body">
                <div class="mb-3">
                    <h6>测试链接：</h6>
                    <div class="d-flex flex-wrap gap-2">
                        <a href="/records?sort_by=id&sort_order=desc" class="btn btn-sm btn-outline-primary" target="_blank">
                            按ID降序
                        </a>
                        <a href="/records?sort_by=subject&sort_order=asc" class="btn btn-sm btn-outline-primary" target="_blank">
                            按科目升序
                        </a>
                        <a href="/records?sort_by=teacher&sort_order=desc" class="btn btn-sm btn-outline-primary" target="_blank">
                            按教师降序
                        </a>
                        <a href="/records?sort_by=date&sort_order=asc" class="btn btn-sm btn-outline-primary" target="_blank">
                            按日期升序
                        </a>
                        <a href="/records?sort_by=start_time&sort_order=desc" class="btn btn-sm btn-outline-primary" target="_blank">
                            按时间降序
                        </a>
                        <a href="/records?sort_by=duration&sort_order=asc" class="btn btn-sm btn-outline-primary" target="_blank">
                            按时长升序
                        </a>
                    </div>
                </div>
                
                <div class="mb-3">
                    <h6>测试组合参数：</h6>
                    <div class="d-flex flex-wrap gap-2">
                        <a href="/records?sort_by=subject&sort_order=asc&teacher=全部&search=数学&page=1&per_page=10" class="btn btn-sm btn-outline-secondary" target="_blank">
                            科目升序 + 搜索"数学"
                        </a>
                        <a href="/records?sort_by=date&sort_order=desc&teacher=张老师&page=2&per_page=25" class="btn btn-sm btn-outline-secondary" target="_blank">
                            日期降序 + 张老师 + 第2页
                        </a>
                    </div>
                </div>
                
                <div id="testResult" class="test-result" style="display: none;">
                    <h6>测试结果：</h6>
                    <div id="resultContent"></div>
                </div>
            </div>
        </div>
        
        <div class="card mt-4">
            <div class="card-header">
                <h5 class="mb-0">排序功能说明</h5>
            </div>
            <div class="card-body">
                <ul class="list-unstyled">
                    <li><i class="fas fa-check text-success me-2"></i> 支持按ID、科目、教师、日期、时间、时长排序</li>
                    <li><i class="fas fa-check text-success me-2"></i> 支持升序和降序排列</li>
                    <li><i class="fas fa-check text-success me-2"></i> 排序图标显示当前排序状态</li>
                    <li><i class="fas fa-check text-success me-2"></i> 支持与其他筛选参数组合使用</li>
                    <li><i class="fas fa-check text-success me-2"></i> 保持分页功能正常工作</li>
                </ul>
            </div>
        </div>
    </div>

    <script>
        // 简单的测试功能
        function testSorting() {
            const resultDiv = document.getElementById('testResult');
            const resultContent = document.getElementById('resultContent');
            
            // 模拟测试结果
            resultContent.innerHTML = `
                <div class="alert alert-success">
                    <i class="fas fa-check-circle me-2"></i>
                    <strong>测试通过！</strong> 排序链接生成正常。
                </div>
                <div class="mt-2">
                    <p>请点击上面的测试链接在实际页面中验证排序功能：</p>
                    <ul>
                        <li>检查表头是否显示正确的排序图标</li>
                        <li>验证数据是否按预期顺序排列</li>
                        <li>测试排序与其他筛选功能的兼容性</li>
                    </ul>
                </div>
            `;
            
            resultDiv.style.display = 'block';
        }
        
        // 页面加载后自动运行测试
        document.addEventListener('DOMContentLoaded', function() {
            testSorting();
        });
    </script>
</body>
</html>
